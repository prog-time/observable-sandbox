global:
  scrape_interval: 10s
  evaluation_interval: 10s

# Job cadvisor лежит в scrape.d/ (монтируется своя папка для каждой среды: scrape.d-test / scrape.d-prod)
scrape_config_files:
  - /etc/prometheus/scrape.d/*.yml

scrape_configs:
  - job_name: app
    static_configs:
      - targets: ["app:8000"]

  - job_name: postgres
    static_configs:
      - targets: ["postgres-exporter:9187"]

  - job_name: loki
    static_configs:
      - targets: ["loki:3100"]

  - job_name: alloy
    static_configs:
      - targets: ["alloy:12345"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
